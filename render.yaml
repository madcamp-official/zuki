# Render Blueprint — 백엔드 배포 설정
# 대시보드에서 New > Blueprint 로 이 레포를 연결하면 아래 설정대로 서비스가 생성된다.
# 문서: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trendpick-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # /health는 DB 연결 없이도 200을 주도록 만들어둬서 헬스체크 경로로 적합
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # 아래 4개는 시크릿이라 값을 여기 적지 않는다.
      # sync: false 로 두면 Render 대시보드에서 직접 입력하게 된다.
      - key: DATABASE_URL
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # 프론트 배포 후 해당 도메인으로 좁힐 것 (쉼표로 여러 개 가능)
      # 미설정 시 전체 허용
      - key: CORS_ORIGIN
        sync: false
